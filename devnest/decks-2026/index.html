<style>
/* Layout: editorial numbered index (hub) → full-viewport snap viewer, one slide per screen. Single dark look, per DevNest Brand System 2026. */
:root{
  --ink:#050506; --panel:#0B0B0E; --fg:#F2F1EC; --muted:#8A8A96; --line:rgba(242,241,236,.13);
  --accent:#5B4FCF; --accent-soft:#9D94F0;
  --display:'Komet','DM Sans',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1); --bar:64px;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
::selection{background:var(--accent);color:var(--fg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:4px}

/* progress (brandbook .prog) */
.prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:2px;width:0;background:var(--accent);z-index:120;transition:width .15s linear}

/* ---------- HUB ---------- */
.hub{max-width:1500px;margin:0 auto;padding-block:28px 72px;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px}
.top .logo{height:26px;color:var(--fg);display:block}
.top .logo svg{height:100%;width:auto;display:block}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono .n{color:var(--accent-soft)}
.hero{padding-block:clamp(56px,12vh,140px) clamp(36px,7vh,80px)}
.hero h1{font-family:var(--display);font-weight:900;text-transform:uppercase;line-height:.86;letter-spacing:-.005em;
  font-size:clamp(44px,10.6vw,200px);text-wrap:balance;margin:0}
.hero h1 .dot{color:var(--accent)}
.hero h1 .cur{display:inline-block;width:.42em;height:.08em;background:var(--accent);margin-left:.08em;animation:blink 1.05s steps(1) infinite}
.hero .sub{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:28px}
.hero .sub p{max-width:46ch;margin:0;font-size:clamp(15px,1.4vw,18px);line-height:1.55;color:#cbcbd2}
@keyframes blink{50%{opacity:0}}

.idx{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.row{position:relative;display:grid;grid-template-columns:84px minmax(0,1fr) auto auto;gap:24px;align-items:center;
  padding:30px 0;border-bottom:1px solid var(--line);cursor:pointer;outline:none}
.row::before{content:'';position:absolute;left:0;bottom:-1px;height:1px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease)}
.row:hover::before,.row:focus-visible::before{transform:scaleX(1)}
.row .ix{font-family:var(--mono);font-size:14px;color:var(--muted);transition:color .4s}
.row .tt{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.92;font-size:clamp(28px,4.6vw,72px);
  transition:transform .7s var(--ease),color .4s;min-width:0;overflow-wrap:anywhere}
.row .md{display:flex;gap:18px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.row .ar{display:inline-flex;align-items:center;gap:10px;position:relative;padding:6px 0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg)}
.row .ar::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .6s var(--ease)}
.row:hover .ar::after,.row:focus-visible .ar::after{transform:scaleX(1);transform-origin:left}
.row .ar svg{width:16px;height:16px;transition:transform .5s var(--ease);color:var(--accent-soft)}
.row:hover .tt,.row:focus-visible .tt{transform:translateX(18px)}
.row:hover .ix,.row:focus-visible .ix{color:var(--accent-soft)}

.row:hover .ar svg{transform:translateX(3px)}
@media(max-width:760px){
  .row{grid-template-columns:40px minmax(0,1fr) 44px;gap:14px;padding:22px 0}
  .row .md{grid-column:2;grid-row:2;flex-wrap:wrap;white-space:normal}
  .row .ar{grid-column:3;grid-row:1/3}
  .row .ar .lb{display:none}
}
.peek{position:fixed;left:0;top:0;width:340px;pointer-events:none;z-index:90;opacity:0;border-radius:12px;overflow:hidden;
  border:1px solid var(--line);transform:translate3d(-999px,-999px,0) scale(.92);transition:opacity .3s,transform .5s var(--ease) ;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.peek img{display:block;width:100%;height:auto}
.peek.on{opacity:1}
@media(hover:none){.peek{display:none}}
.foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:40px}

/* ---------- VIEWER ---------- */
.viewer{position:fixed;inset:0;z-index:60;background:var(--ink);overflow-y:auto;overscroll-behavior:contain;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(var(--bar) + env(safe-area-inset-top,0px));padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:calc(var(--bar) + env(safe-area-inset-top,0px))}
.bar{position:fixed;left:0;right:0;top:0;z-index:70;height:calc(var(--bar) + env(safe-area-inset-top,0px));
  padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;background:rgba(5,5,6,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.back{justify-self:start;display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;position:relative;padding:6px 0}
.back::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--fg);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.back:hover::after{transform:scaleX(1);transform-origin:left}
.bar .ttl{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:15px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
.nav{justify-self:end;display:flex;align-items:center;gap:10px}
.nav .cnt{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:6px}
.nav .cnt b{color:var(--fg);font-weight:500}
.nb{display:inline-flex;align-items:center;gap:8px;position:relative;padding:6px 0;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin-left:14px}
.nb::after{content:'';position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.nb:hover::after{transform:scaleX(1);transform-origin:left}
.nb svg{width:14px;height:14px;color:var(--accent-soft)}
@media(max-width:420px){.nb .lb{display:none}}
@media(max-width:640px){.bar .ttl{display:none}.bar{grid-template-columns:1fr auto}}
@media(max-width:420px){.back .bl{display:none}.back::before{content:'Back'}}

.frame{display:grid;place-items:center;height:calc(100dvh - var(--bar) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding:20px 0}
.fit{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:100%}
.scaler{transform-origin:0 0;position:absolute;left:0;top:0}
.frame.pre .scaler{opacity:0}
@media(max-width:760px),(max-height:520px){.frame{height:auto;padding:12px 0}}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}

/* slide micro-interactions (hover) */
.deck .cell{transition:transform .5s var(--ease),box-shadow .5s;position:relative}
.deck .cell img{transition:transform .5s var(--ease)}
.deck .cell:hover{transform:translateY(-4px);z-index:3;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.deck .cell:hover img{transform:scale(1.08)}
.deck .rowx{transition:padding .5s var(--ease),background .5s}
.deck .rowx:hover{padding-left:14px!important;background:rgba(91,79,207,.09)}
.deck .r14{transition:transform .6s var(--ease)}
.deck div[style*="height:380px;background:url"]:hover{transform:scale(1.03)}
.deck .big[style*="text-transform:none"]{transition:color .3s}
.deck .big[style*="text-transform:none"]:hover{color:var(--accent-soft)}
.deck .lime{transition:border-color .5s}
.deck .lime:hover{border-color:rgba(91,79,207,.6)}
.deck .cur2{animation:blink 1.05s steps(1) infinite}


/* icon blocks & columns: hover + idle motion */
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -10px}}
.deck .hv{transition:transform .7s var(--ease),border-color .5s,background .5s}
.deck .hv img{transition:transform .8s var(--ease),filter .6s}
.deck .hv .out{transition:color .5s,-webkit-text-stroke-color .5s}
.deck .hv .big,.deck .hv .mid{transition:transform .7s var(--ease),color .4s}
.deck .step img,.deck .card img{animation:floaty 5.5s ease-in-out infinite}
.deck .step:nth-child(2) img,.deck .card:nth-child(2) img{animation-delay:-1.4s}
.deck .step:nth-child(3) img,.deck .card:nth-child(3) img{animation-delay:-2.8s}
.deck .step:nth-child(4) img{animation-delay:-4.2s}
.deck .step:hover img{transform:translateY(-16px) rotate(-6deg) scale(1.1);filter:drop-shadow(0 22px 30px rgba(91,79,207,.6))}
.deck .step > div:nth-child(2){transition:background .6s}
.deck .step:hover > div:nth-child(2){background:var(--accent)!important}
.deck .step > div:nth-child(2) > div{transition:left 1s var(--ease),background .5s}
.deck .step:hover > div:nth-child(2) > div{left:calc(100% - 20px)!important;background:var(--accent)!important}
.deck .hv:hover .out{color:var(--accent)!important;-webkit-text-stroke-color:var(--accent)!important}
.deck .step:hover .big{transform:translateX(12px);color:var(--accent-soft)}
.deck .card{cursor:default;border-radius:16px;overflow:hidden}
.deck .card:hover{transform:translateY(-12px);border-color:var(--accent)!important;background:#0F0E1C!important}
.deck .card:hover img{transform:scale(1.18) rotate(-4deg);filter:drop-shadow(0 16px 28px rgba(91,79,207,.65))}
.deck .card:hover .big{color:var(--accent-soft)}
.deck .col:hover{transform:translateY(-10px);border-left-color:var(--accent)!important}
.deck .col:hover > .big,.deck .col:hover > .mid,.deck .col .big:first-of-type{}
.deck .col:hover .mid{color:var(--accent-soft)}
.deck .proj:hover .big{transform:translateX(10px);color:var(--accent-soft)}
.deck .proj > div[style*="height:6px"]{transition:width .8s var(--ease)}
.deck .proj:hover > div[style*="height:6px"]{width:100%!important}
.deck .val:hover{transform:translateY(-8px);border-left-color:var(--accent)!important}
.deck .val:hover .mid{color:var(--accent-soft)}
.deck .person:hover .mid{transform:translateX(8px)}

/* page transition (wipe) */
.wipe{position:fixed;inset:0;z-index:200;background:var(--accent);pointer-events:none;visibility:hidden}
.wipe .wm{position:absolute;left:50%;top:50%;width:min(320px,60vw);transform:translate(-50%,-50%);color:var(--ink)}
.wipe .wm svg{width:100%;height:auto;display:block}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.frame.pre .scaler{opacity:1}}

<script>
(function(){
const META = [{"id": "grow", "label": "DevNest — Grow. Build. Explore", "fmt": "16:9", "n": 13}, {"id": "ai", "label": "DevNest introduction — AI portofolio", "fmt": "16:9", "n": 15}, {"id": "short", "label": "DevNest short introduction", "fmt": "16:9", "n": 11}, {"id": "ad", "label": "DevNest ad", "fmt": "1200 × 628", "n": 2}, {"id": "cyber", "label": "CyberSecurity. Powered by DevNest", "fmt": "A4", "n": 2}];
const THUMB = {grow:'/ksm-website/devnest/decks-2026/thumbs/grow-01.jpg',ai:'/ksm-website/devnest/decks-2026/thumbs/ai-01.jpg',short:'/ksm-website/devnest/decks-2026/thumbs/short-01.jpg',ad:'/ksm-website/devnest/decks-2026/thumbs/ad-1.jpg',cyber:'/ksm-website/devnest/decks-2026/thumbs/cyber-1.jpg'};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const hasG = typeof gsap !== 'undefined';
const $ = s => document.querySelector(s);
const hub=$('#hub'), viewer=$('#viewer'), idx=$('#idx'), wipe=$('#wipe'), prog=$('#prog');
const pad2 = n => String(n).padStart(2,'0');
/* smooth scroll (brandbook: Lenis) */
const hasL = typeof Lenis !== 'undefined' && !RM;
let hubL=null, vL=null;
if(hasL){ hubL=new Lenis({duration:1.15,easing:t=>Math.min(1,1.001-Math.pow(2,-10*t))});
  (function raf(t){ hubL&&hubL.raf(t); vL&&vL.raf(t); requestAnimationFrame(raf); })(performance.now()); }

/* ---- scramble (brandbook: decrypt-style text) ---- */
const GLY='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_$#/';
function scramble(el, dur){
  if(RM) return;
  dur = dur||800;
  const nodes=[]; const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
  let n; while((n=w.nextNode())){ if(n.nodeValue.trim()) nodes.push([n,n.__orig||(n.__orig=n.nodeValue)]); }
  const total=nodes.reduce((a,[,t])=>a+t.length,0); if(!total) return;
  const t0=performance.now(); el.__scr=t0;
  (function tick(now){
    if(el.__scr!==t0) return;
    const p=Math.min(1,(now-t0)/dur), reveal=Math.floor(p*total); let k=0;
    for(const [node,txt] of nodes){
      let s=''; for(let i=0;i<txt.length;i++,k++){ const c=txt[i]; s+= (k<reveal||c===' '||c==='\n')?c:GLY[(Math.random()*GLY.length)|0]; }
      node.nodeValue=s;
    }
    if(p<1) requestAnimationFrame(tick); else for(const [node,txt] of nodes) node.nodeValue=txt;
  })(t0);
}

/* ---- magnetic hover ---- */
function magnet(el){
  if(RM || matchMedia('(hover:none)').matches) return;
  el.style.transition='transform .5s cubic-bezier(.16,1,.3,1)';
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();const x=(e.clientX-r.left-r.width/2)*.3,y=(e.clientY-r.top-r.height/2)*.3;el.style.transform=`translate(${x}px,${y}px)`;});
  el.addEventListener('pointerleave',()=>{el.style.transform='';});
}

/* ---- hub index ---- */
const arrow='<svg viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.6"/></svg>';
META.forEach((m,i)=>{
  const li=document.createElement('li'); li.className='row'; li.tabIndex=0; li.dataset.id=m.id; li.setAttribute('role','link');
  li.innerHTML=`<span class="ix">( ${pad2(i+1)} )</span><span class="tt">${m.label}</span><span class="md"><span>${pad2(m.n)} slides</span><span>${m.fmt}</span></span><span class="ar mag"><span class="lb">Open</span>${arrow}</span>`;
  li.addEventListener('click',()=>openDeck(m.id));
  li.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDeck(m.id);}});
  li.addEventListener('pointerenter',()=>{scramble(li.querySelector('.tt'),650);showPeek(m.id);loadDeck(m.id);});
  li.addEventListener('pointerleave',hidePeek);
  idx.appendChild(li);
});
document.querySelectorAll('.mag').forEach(magnet);
$('#logo').addEventListener('click',e=>{e.preventDefault();scramble($('#hh'),700);});

/* thumbnail peek follows the cursor */
const peek=$('#peek'), peekimg=$('#peekimg'); let px=0,py=0;
function showPeek(id){peekimg.src=THUMB[id];peek.classList.add('on');}
function hidePeek(){peek.classList.remove('on');}
addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY;peek.style.transform=`translate3d(${px+28}px,${py-110}px,0) scale(${peek.classList.contains('on')?1:.92})`;});

/* hero intro */
if(hasG && !RM){
  gsap.from('.hero h1',{yPercent:30,opacity:0,duration:1.2,ease:'expo.out'});
  gsap.from('.row',{y:30,opacity:0,duration:1,stagger:.08,ease:'expo.out',delay:.25});
}
setTimeout(()=>scramble($('#hh'),900),150);

/* ---- viewer ---- */
let cur=null, io=null, idxIO=null, curI=1;
function fitAll(){
  if(!cur) return;
  const W=+cur.dataset.w, H=+cur.dataset.h;
  const narrow = innerWidth<=760 || innerHeight<=520;
  const cs=getComputedStyle(viewer); const vw = viewer.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const vh = viewer.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (narrow?24:40);
  const s = Math.min(vw/W, narrow? 9 : vh/H, 1.6);
  cur.querySelectorAll('.fit').forEach(f=>{f.style.width=(W*s)+'px';f.style.height=(H*s)+'px';f.firstElementChild.style.transform=`scale(${s})`;});
}
function animateSlide(frame){
  frame.classList.remove('pre');
  if(RM || !hasG) return;
  const sec=frame.querySelector('.slide');
  gsap.fromTo(frame.querySelector('.fit'),{scale:.97,opacity:0},{scale:1,opacity:1,duration:.9,ease:'expo.out'});
  sec.querySelectorAll('.mega,.big').forEach((t,i)=>{
    const txt=t.textContent.trim();
    if(/^\d{2,4}$/.test(txt)){ // counters (brandbook: live counter)
      const end=+txt, start= end>1000? end-29 : 0, len=txt.length, o={v:start};
      const node=[...t.childNodes].find(c=>c.nodeType===3 && c.nodeValue.trim()) || t;
      gsap.to(o,{v:end,duration:1.4,ease:'power3.out',onUpdate:()=>{const s=String(Math.round(o.v)).padStart(len,'0'); if(node.nodeType===3) node.nodeValue=s; else node.textContent=s;}});
    } else setTimeout(()=>scramble(t,700+Math.min(txt.length*6,500)),i*90);
  });
  const blocks=sec.querySelectorAll('.bx,.rowx,.tag,.mid,.r14,.wallbox,.lime,.wm,img:not(.cell img),.cell');
  gsap.from(blocks,{y:26,opacity:0,duration:.9,stagger:{each:.018,from:'start'},ease:'expo.out',delay:.1,clearProps:'transform,opacity'});
  sec.querySelectorAll('svg circle').forEach(c=>{const r=+c.getAttribute('r');if(!r)return;const L=2*Math.PI*r;const orig=c.getAttribute('stroke-dasharray');
    gsap.fromTo(c,{attr:{'stroke-dasharray':`0 ${L}`}},{attr:{'stroke-dasharray':orig||`${L} 0`},duration:1.6,ease:'power2.inOut',delay:.2});});
}
const loaded={};
function loadDeck(id){ const el=$('#deck-'+id); if(!el||!el.dataset.src) return Promise.resolve();
  return loaded[id]||(loaded[id]=fetch(el.dataset.src).then(r=>r.text()).then(t=>{el.innerHTML=t;}).catch(()=>{delete loaded[id];})); }
function openDeck(id,instant){
  const m=META.find(x=>x.id===id); if(!m) return;
  const go=async()=>{
    await loadDeck(id);
    hidePeek();
    document.querySelectorAll('.deck').forEach(d=>d.hidden=true);
    cur=$('#deck-'+id); cur.hidden=false; hub.hidden=true; viewer.hidden=false;
    $('#ttl').textContent=m.label; curI=1; updCnt();
    cur.querySelectorAll('.frame').forEach(f=>f.classList.add('pre'));
    viewer.scrollTop=0; fitAll();
    if(hasL){ hubL&&hubL.stop(); vL&&vL.destroy(); vL=new Lenis({wrapper:viewer,content:cur,duration:1.1,easing:t=>Math.min(1,1.001-Math.pow(2,-10*t))}); }
    try{history.replaceState(null,'','#'+id);}catch(e){}
    io&&io.disconnect(); idxIO&&idxIO.disconnect();
    io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting&&e.target.classList.contains('pre'))animateSlide(e.target);}),{root:viewer,threshold:.35});
    idxIO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){curI=+e.target.dataset.i;updCnt();}}),{root:viewer,threshold:.6});
    cur.querySelectorAll('.frame').forEach(f=>{io.observe(f);idxIO.observe(f);});
    viewer.focus({preventScroll:true});
  };
  transition(go,instant);
}
function closeDeck(){
  transition(()=>{if(vL){vL.destroy();vL=null;} hubL&&hubL.start(); viewer.hidden=true;hub.hidden=false;cur=null;io&&io.disconnect();idxIO&&idxIO.disconnect();prog.style.width='0';
    try{history.replaceState(null,'',location.pathname);}catch(e){} window.scrollTo(0,0);});
}
function transition(fn,instant){
  if(instant||RM||!hasG){fn();return;}
  const tl=gsap.timeline();
  tl.set(wipe,{y:0,yPercent:100,autoAlpha:1}).to(wipe,{yPercent:0,duration:.55,ease:'expo.inOut'})
    .add(()=>{tl.pause(); Promise.resolve(fn()).finally(()=>tl.resume());}).to(wipe,{yPercent:-100,duration:.65,ease:'expo.inOut',delay:.12}).set(wipe,{autoAlpha:0});
}
function updCnt(){ if(!cur) return; const n=cur.querySelectorAll('.frame').length; $('#cnt').innerHTML=`( <b>${pad2(curI)}</b> / ${pad2(n)} )`; }
function goTo(i){ if(!cur) return; const fr=cur.querySelectorAll('.frame'); i=Math.max(1,Math.min(fr.length,i));
  const bar=parseFloat(getComputedStyle(viewer).paddingTop)||0;
  if(vL){ vL.scrollTo(fr[i-1].offsetTop - bar, {duration:1.1}); } else fr[i-1].scrollIntoView({behavior:RM?'auto':'smooth',block:'start'}); }
$('#prev').addEventListener('click',()=>goTo(curI-1));
$('#next').addEventListener('click',()=>goTo(curI+1));
$('#back').addEventListener('click',e=>{e.preventDefault();closeDeck();});
viewer.tabIndex=-1;
viewer.addEventListener('scroll',()=>{const max=viewer.scrollHeight-viewer.clientHeight;prog.style.width=(max>0?viewer.scrollTop/max*100:0)+'%';},{passive:true});
addEventListener('keydown',e=>{
  if(viewer.hidden) return;
  if(['ArrowDown','ArrowRight','PageDown'].includes(e.key)){e.preventDefault();goTo(curI+1);}
  else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();goTo(curI-1);}
  else if(e.key==='Escape'){closeDeck();}
});
addEventListener('resize',fitAll);
const h=(location.hash||'').slice(1); if(h && META.some(m=>m.id===h)) openDeck(h,true);
})();
</script>
